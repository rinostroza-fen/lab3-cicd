---
apiVersion: v1
kind: Namespace
metadata:
  name: ns-roberto-inostroza
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-roberto-inostroza
  namespace: ns-roberto-inostroza
data:
  AMBIENTE: "produccion"
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-roberto-inostroza
  namespace: ns-roberto-inostroza
type: Opaque
stringData:
  API_KEY: "super-secret-key-123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-roberto-inostroza
  namespace: ns-roberto-inostroza
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-roberto-inostroza
  template:
    metadata:
      labels:
        app: app-roberto-inostroza
    spec:
      containers:
      - name: app
        image: ghcr.io/rinostroza-fen/tarea-final:roberto-inostroza
        ports:
        - containerPort: 3000
        env:
        - name: AMBIENTE
          valueFrom:
            configMapKeyRef:
              name: config-roberto-inostroza
              key: AMBIENTE
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: secret-roberto-inostroza
              key: API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: svc-roberto-inostroza
  namespace: ns-roberto-inostroza
spec:
  selector:
    app: app-roberto-inostroza
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP